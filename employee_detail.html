<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>社員詳細 — 統合管理システム</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;600;700&family=Shippori+Mincho:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/common.css">
<link rel="stylesheet" href="assets/css/visual-upgrade.css">
<link rel="stylesheet" href="assets/css/saas-ui.css">
<link rel="stylesheet" href="assets/css/ui-common.css">
</head>
<body>
<div class="app-shell">
<aside class="sidebar" id="sidebar"></aside>
<div class="page-content">
<main class="page-main">

  <div class="page-header">
    <!-- ヘッダー背景画像: 社員向けの画像をここに差し込む -->
    <div class="page-header-img-slot">
      <img src="assets/img/imperial/bg-theater.png" alt="" aria-hidden="true">
    </div>
    <div class="page-heading">
      <div class="page-icon" data-icon="employees" aria-hidden="true"></div>
      <div class="page-title-block">
        <div class="page-title">社員詳細</div>
        <div class="page-title-en">EMPLOYEE DETAIL</div>
      </div>
    </div>
    <div class="page-header-actions">
      <a href="employees.html" class="btn btn-secondary btn-sm">← 一覧へ戻る</a>
    </div>
  </div>

  <!-- 社員プロフィール -->
  <div class="content-grid" style="grid-template-columns: 340px 1fr;">
    <div class="card">
      <div class="card-header">
        <div>
          <div class="card-title">プロフィール</div>
          <div class="card-sub">基本情報</div>
        </div>
      </div>
      <div class="card-body" style="text-align:center; padding: 28px 20px;">
        <!-- プロフィール画像: src を差し替えるだけで変更可能 -->
        <div style="width:80px;height:80px;border-radius:50%;margin:0 auto 16px;background:linear-gradient(135deg,#082838,#0a3848);border:2px solid rgba(200,148,40,.65);display:grid;place-items:center;font-family:'Shippori Mincho',serif;font-size:28px;font-weight:900;color:#e8c060;" id="emp-avatar-initial">?</div>
        <!-- または: <img src="assets/img/employees/[employee_id].jpg" alt="" style="width:80px;height:80px;border-radius:50%;object-fit:cover;margin:0 auto 16px;display:block;border:2px solid rgba(200,148,40,.65);"> -->

        <div style="font-family:'Shippori Mincho',serif;font-size:22px;font-weight:800;" id="emp-name">—</div>
        <div style="font-size:13px;color:var(--s-muted);margin-top:4px;" id="emp-kana">—</div>
        <div style="margin-top:14px;" id="emp-badges"></div>

        <div style="margin-top:20px;text-align:left;border-top:1px solid rgba(180,130,30,.18);padding-top:18px;display:grid;gap:12px;">
          <div class="dl-item">
            <span class="dl-label">社員コード</span>
            <span class="dl-value" id="emp-code">—</span>
          </div>
          <div class="dl-item">
            <span class="dl-label">センター</span>
            <span class="dl-value" id="emp-center">—</span>
          </div>
          <div class="dl-item">
            <span class="dl-label">部門</span>
            <span class="dl-value" id="emp-division">—</span>
          </div>
          <div class="dl-item">
            <span class="dl-label">職種</span>
            <span class="dl-value" id="emp-position">—</span>
          </div>
          <div class="dl-item">
            <span class="dl-label">雇用形態</span>
            <span class="dl-value" id="emp-employment">—</span>
          </div>
          <div class="dl-item">
            <span class="dl-label">等級</span>
            <span class="dl-value" id="emp-grade">—</span>
          </div>
          <div class="dl-item">
            <span class="dl-label">最終昇格日</span>
            <span class="dl-value" id="emp-last-promo">—</span>
          </div>
        </div>
      </div>
    </div>

    <div style="display:grid;gap:20px;align-content:start;">
      <div class="card">
        <div class="card-header card-header-navy">
          <div>
            <div class="card-title">保有資格・免許</div>
            <div class="card-sub">employee_licenses テーブル参照</div>
          </div>
        </div>
        <div class="card-body" id="emp-licenses-body">
          <div class="empty">読込中…</div>
        </div>
      </div>
    </div>
  </div>

</main>
</div>
</div>
<div id="toast-container"></div>
<style>
.dl-item { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
.dl-label { font-size: 12px; color: var(--s-muted); font-family: 'Shippori Mincho', serif; white-space: nowrap; }
.dl-value { font-size: 13.5px; font-weight: 600; color: var(--s-ink); text-align: right; }
</style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="assets/js/supabase.js"></script>
<script src="assets/js/common.js"></script>
<script>
async function initDetail() {
  APP.initHeader();
  const params = new URLSearchParams(location.search);
  const id = params.get('id');
  if (!id) { APP.toast('社員IDが指定されていません', 'error'); return; }

  const employees = await APP.loadEmployees();
  const e = employees.find(x => String(x.id) === String(id));
  if (!e) { APP.toast('社員が見つかりません', 'error'); return; }

  document.title = `${e.name} — 社員詳細`;
  document.getElementById('emp-avatar-initial').textContent = (e.name || '?')[0];
  document.getElementById('emp-name').textContent = e.name || '—';
  document.getElementById('emp-kana').textContent = e.kana || '';
  document.getElementById('emp-code').textContent = e.employee_code || '—';
  document.getElementById('emp-center').textContent = e.center || '—';
  document.getElementById('emp-division').textContent = e.division || '—';
  document.getElementById('emp-position').textContent = e.position || '—';
  document.getElementById('emp-employment').textContent = e.employment_type || '—';
  document.getElementById('emp-grade').textContent = e.current_grade || '—';
  document.getElementById('emp-last-promo').textContent = APP.fmtDate(e.last_promotion_date);

  const badgesEl = document.getElementById('emp-badges');
  if (e.promotion_target_flag === true || e.promotion_target_flag === 'true') {
    badgesEl.innerHTML = APP.badge('昇格候補', 'primary');
  }

  // 資格一覧
  const licRows = await APP.loadLicenseRows();
  const myLics = licRows.filter(r => String(r.employee_id) === String(id));
  const bodyEl = document.getElementById('emp-licenses-body');
  if (!myLics.length) {
    bodyEl.innerHTML = '<div class="empty">登録済みの資格・免許はありません</div>';
    return;
  }
  bodyEl.innerHTML = `
    <div class="table-wrap">
      <table>
        <thead><tr><th>資格名</th><th>区分</th><th>取得日</th><th>期限日</th><th>状態</th><th>残日数</th></tr></thead>
        <tbody>${myLics.map(r => {
          const days = APP.daysUntil(r.expiration_date);
          const st = APP.normStatus(r.alert_status, r.expiration_date);
          const cls = APP.statusClass(st);
          return `<tr>
            <td><div class="cell-main">${APP.escape(r.license_name)}</div></td>
            <td>${APP.escape(r.category_name || '—')}</td>
            <td>${APP.fmtDate(r.acquired_date)}</td>
            <td>${APP.fmtDate(r.expiration_date)}</td>
            <td>${APP.badge(st, cls)}</td>
            <td>${days === null ? '—' : days < 0 ? APP.badge(Math.abs(days)+'日超過', 'danger') : APP.badge('残り'+days+'日', cls)}</td>
          </tr>`;
        }).join('')}</tbody>
      </table>
    </div>`;
}
(async()=>{ await Auth.requireAuth(); renderSidebar('employees'); Modal.setup(); await initDetail(); })();
</script>
</body>
</html>
