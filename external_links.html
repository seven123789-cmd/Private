<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>外部リンク — 人事統合管理システム</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;600;700&family=Shippori+Mincho:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/app.css">
</head>
<body>
<div class="app-shell">
<aside class="sidebar" id="sidebar"></aside>
<div class="page-content">
<main class="page-main">

  <div class="page-header">
    <div class="page-heading">
      <div>
        <div class="page-title">外部リンク</div>
        <div class="page-title-en">EXTERNAL LINK BOARD</div>
      </div>
    </div>
  </div>

  <section class="card external-link-board">
    <div class="card-header">
      <div>
        <div class="card-title">リンク管理</div>
        <div class="card-sub">よく使う外部URLを登録し、この画面から開けます</div>
      </div>
    </div>
    <div class="card-body">
      <div class="external-link-control">
        <label class="form-field">
          <span class="field-label">表示名</span>
          <input id="external-link-label" type="text" maxlength="30" placeholder="例：小型家電Forms">
        </label>
        <label class="form-field">
          <span class="field-label">リンク先URL</span>
          <input id="external-link-url" type="url" placeholder="https://...">
        </label>
        <button class="btn btn-primary" id="external-link-add" type="button">追加</button>
      </div>

      <div style="height:22px"></div>

      <div class="external-link-list-head">
        <div class="external-link-list-title">登録リンク</div>
        <div class="external-link-count" id="external-link-count">0件</div>
      </div>
      <div class="external-link-list" id="external-link-list"></div>
    </div>
  </section>

</main>
</div>
</div>
<script src="assets/js/supabase.js"></script>
<script src="assets/js/common.js"></script>
<script>(async()=>{await Auth.requireAuth();renderSidebar('external_links');APP.initHeader();APP.initExternalLinksPage();})();</script>
</body>
</html>
